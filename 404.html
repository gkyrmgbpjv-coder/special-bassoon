<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page introuvable · Abondance</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Instrument+Sans:wght@400;600;700&display=swap">
<style>
:root{--ground:#0f1412;--ink:#f2ead9;--soft:#cbc3b0;--amber:#eaa23c;--board:#1f2d26;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:18px/1.55 "Instrument Sans","Helvetica Neue",Arial,sans-serif;display:grid;place-items:center;padding:24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px))}
main{max-width:620px;display:flex;flex-direction:column;gap:24px}
.slate{background:var(--board);border:12px solid #5b3a21;border-radius:6px;padding:28px 32px;transform:rotate(-1.5deg)}
h1{font-family:"Big Shoulders Display","Arial Narrow",sans-serif;font-weight:900;font-size:clamp(56px,12vw,104px);line-height:.88;text-transform:uppercase;margin:0;color:#ece8dc}
p{margin:0;color:var(--soft)}
.slate p{color:#e2dfd2;margin-top:14px;font-size:20px}
.row{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.cta{display:inline-flex;align-items:center;min-height:52px;padding:0 26px;border-radius:999px;background:var(--amber);color:#1d1a15;font-weight:700;text-decoration:none}
.cta:hover{background:#f3b14f}
a{color:var(--ink);text-underline-offset:.22em}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="slate">
    <h1>Plus à la carte</h1>
    <p>Cette page n'existe pas, ou elle a changé d'adresse comme le menu du jour.</p>
  </div>
  <p>Retrouvez la carte, les horaires et la réservation sur la page d'accueil.</p>
  <div class="row">
    <a class="cta" href="index.html">Revenir à l'accueil</a>
    <a href="index.html#carte">Voir la carte</a>
  </div>
</main>
</body>
</html>
